
name: SonarQube - Analyse ASP.NET Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install SonarScanner
        shell: bash
        run: |
          echo "SCANNER_DOTNET_ROOT=$(dirname "$(readlink -f "$(command -v dotnet)")")" >> "$GITHUB_ENV"

          cd "$RUNNER_TEMP"

          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/sonar-scanner"

      - name: Restore ASP.NET Core
        run: ./restore.sh
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build JavaScript assets
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build and analyze
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          source ./activate.sh

          SCANNER="$RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner"

          # Verify configuration
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_ORGANIZATION"

          # Start SonarQube analysis
          DOTNET_ROOT="$SCANNER_DOTNET_ROOT" "$SCANNER" begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.inclusions="src/Http/**"

          # Build ASP.NET Core HTTP projects
          ./src/Http/build.sh \
          -warnAsError false \
          /p:TreatWarningsAsErrors=false

          # Send analysis results to SonarQube
          DOTNET_ROOT="$SCANNER_DOTNET_ROOT" "$SCANNER" end \
            /d:sonar.token="$SONAR_TOKEN"
